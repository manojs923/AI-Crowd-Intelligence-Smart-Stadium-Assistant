name: AWS Showcase

on:
  workflow_dispatch:
    inputs:
      budget_alert_email:
        description: Email address for the AWS budget alert
        required: true
        type: string
      aws_region:
        description: AWS region for the optional showcase
        required: true
        default: us-east-1
        type: string
      monthly_budget_usd:
        description: AWS monthly budget alert threshold in USD
        required: true
        default: 10
        type: number

permissions:
  contents: read

jobs:
  aws-showcase:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ inputs.aws_region }}
      TF_STATE_BUCKET: ${{ vars.AWS_TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and build frontend
        run: |
          npm ci
          for name in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID; do
            if [ -z "${!name}" ]; then
              echo "Set the $name repository variable."
              exit 1
            fi
          done
          npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws_region }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Initialize Terraform state
        run: |
          if [ -z "$TF_STATE_BUCKET" ]; then
            echo "Set the AWS_TF_STATE_BUCKET repository variable to an encrypted, versioned S3 bucket."
            exit 1
          fi
          terraform -chdir=infra/aws init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=stadium/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Apply AWS showcase stack
        env:
          BUDGET_ALERT_EMAIL: ${{ inputs.budget_alert_email }}
          MONTHLY_BUDGET_USD: ${{ inputs.monthly_budget_usd }}
        run: |
          terraform -chdir=infra/aws apply -auto-approve \
            -var="aws_region=$AWS_REGION" \
            -var="budget_alert_email=$BUDGET_ALERT_EMAIL" \
            -var="monthly_budget_usd=$MONTHLY_BUDGET_USD"

      - name: Upload frontend to S3
        run: |
          S3_BUCKET="$(terraform -chdir=infra/aws output -raw s3_bucket_name)"
          DISTRIBUTION_ID="$(terraform -chdir=infra/aws output -raw cloudfront_distribution_id)"
          aws s3 sync dist/ "s3://$S3_BUCKET" --delete
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"

      - name: Build and push backend showcase image
        run: |
          ECR_REPOSITORY="$(terraform -chdir=infra/aws output -raw ecr_repository_url)"
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$ECR_REPOSITORY"
          docker build -t "$ECR_REPOSITORY:$GITHUB_SHA" infra/aws/backend
          docker push "$ECR_REPOSITORY:$GITHUB_SHA"
